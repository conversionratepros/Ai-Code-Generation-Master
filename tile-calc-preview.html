<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Calculator — redesign preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,Arial,sans-serif;background:#f3f4f6;margin:0;padding:40px;text-align:center;}
  h1{font-size:16px;color:#374151;}
  #calc_btn{margin-top:16px;padding:12px 20px;border-radius:6px;border:1px solid #00a63e;background:#00a63e;color:#fff;font-size:15px;cursor:pointer;}
  .note{color:#6b7280;font-size:13px;margin-top:24px;}
</style>
</head>
<body>
  <h1>Preview — click the button to open the redesigned Tile Calculator</h1>
  <button type="button" id="calc_btn">Tile Calculator</button>
  <p class="note">Try: Floor/Wall toggle, "How to measure", type width×length, Add Area, delete, and "Swipe up" for the summary sheet.</p>

  <!-- stubs that stand in for the real CTM page fields the script reads/writes -->
  <input type="hidden" id="umren" value="25">
  <input type="hidden" id="umrez" value="63">
  <form id="product_addtocart_form" onsubmit="event.preventDefault(); alert('Add to cart → qty-box='+document.getElementById('qty-box').value+', area_to_cover='+document.getElementById('area_to_cover').value); return false;">
    <input type="hidden" id="qty-box" value="1">
    <input type="hidden" id="area_to_cover" value="1">
  </form>

  <script src="./tile-calc-redesign.js"></script>
</body>
</html>
