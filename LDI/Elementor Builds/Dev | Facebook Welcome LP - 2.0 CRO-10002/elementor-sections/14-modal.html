<div class="ldi-v2">
<div class="modal-overlay" id="register-modal" aria-hidden="true">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="register-modal-title">
      <button class="modal-close" type="button" aria-label="Close" data-close-modal>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M2 2L16 16M16 2L2 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <div class="modal-body">
        <div class="modal-head">
          <span class="eyebrow">Register your interest</span>
          <h2 class="section-heading" id="register-modal-title">Fill in your details below and we'll send you
            everything you need to get started</h2>
        </div>
        <!-- ═══ Gravity Form 41 ═══
             In the WordPress/Elementor build, drop this shortcode into a Shortcode widget
             (or use the Gravity Forms widget → Form 41) inside the popup.
             Renders the live form and saves submissions to Forms → Entries.
             Field map: input_1 = First Name · input_3 = Last Name · input_2 = Email ·
                        input_5.1 = "I am a registered dental professional *" checkbox
             Note: shortcodes only render inside WordPress — the local preview shows the code as text. -->
        <div class="modal-form gf-embed">
          [gravityform id="41" title="false" description="false" ajax="true"]
        </div>
      </div>
    </div>
  </div>

<script>
    // ─── Register modal ───────────────────────────────────────────────
    (function () {
      const modal = document.getElementById('register-modal');
      let lastFocused = null;

      function openModal(e) {
        if (e) e.preventDefault();
        lastFocused = document.activeElement;
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (lastFocused) lastFocused.focus();
      }

      document.querySelectorAll('.open-register').forEach(btn => btn.addEventListener('click', openModal));
      modal.querySelectorAll('[data-close-modal]').forEach(el => el.addEventListener('click', closeModal));
      // click outside dialog closes
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      // ESC closes
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal(); });
    })();
  </script>
</div>
