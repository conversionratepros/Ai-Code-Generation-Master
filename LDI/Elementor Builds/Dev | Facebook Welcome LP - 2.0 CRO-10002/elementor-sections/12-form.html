<div class="ldi-v2">
<section class="section section-form" id="form-section">
      <div class="container form-grid">
        <div class="form-text">
          <div class="form-head">
            <span class="eyebrow">Get Started</span>
            <h2 class="section-heading">Register your interest and we'll send you the details</h2>
          </div>
          <!-- TODO: replace action / wire to WP form plugin shortcode on build -->
          <form class="register-form" action="#" method="POST">
            <div class="form-row">
              <div class="form-group">
                <label for="first-name">First Name:*</label>
                <input type="text" id="first-name" name="first_name" required />
              </div>
              <div class="form-group">
                <label for="last-name">Last Name:*</label>
                <input type="text" id="last-name" name="last_name" required />
              </div>
            </div>
            <div class="form-group">
              <label for="email">Email Address:*</label>
              <input type="email" id="email" name="email" required />
            </div>
            <label class="checkbox-row">
              <input type="checkbox" name="is_professional" required />
              <span>I am a registered dental professional *</span>
            </label>
            <button type="submit" class="btn btn-primary">
              Register your interest
              <svg class="btn-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M3 9h11M9.5 4.5L14 9l-4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
            </button>
            <p class="form-disclaimer">
              By registering, you consent to receive future communications from us in accordance with our Privacy
              Policy.
            </p>
          </form>
        </div>
        <div class="form-image">
          <img src="https://media.londondentalinstitute.com/wp-content/uploads/2026/07/16020028/form.jpg" alt="LDI clinical simulation kit" />
        </div>
      </div>
    </section>
</div>
