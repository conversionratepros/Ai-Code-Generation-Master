    - generic [ref=e27]:
      - paragraph [ref=e28]: You're already seeing these patients.
      - paragraph [ref=e29]:
        - text: The worn anteriors. The discoloured composites that have never quite matched. The patient who points at their smile and says
        - emphasis [ref=e30]: can we do something about all of this?
      - paragraph [ref=e31]: You can treat them. But often, you only treat part of it. Perhaps just a single tooth when all anteriors need addressing. Whitening when more intervention was justifiable. Something very conservative when the patient was ready for something more comprehensive.
      - paragraph [ref=e32]: It's not about ability. It's that aesthetic cases don't arrive with a clear framework the way simpler restorative ones do — no agreed sequence for full-arch planning, no structured approach to reading occlusion into a smile case, no formal training in how to build and present a treatment plan that genuinely addresses what the patient came in for.
      - paragraph [ref=e33]: So you do what you can confidently justify. And the patient leaves with something, rather than everything they needed, or wanted.
    - generic [ref=e35]:
      - heading "Build the clinical framework to treat aesthetic cases in full" [level=2] [ref=e37]
      - paragraph [ref=e38]: Over 12 months, you build the clinical framework to assess, plan, and deliver aesthetic cases in full — with the confidence to propose treatment that properly meets what your patients are asking for.
